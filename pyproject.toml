[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citesentry"
version = "0.1.1"
description = "Citation verification tool: existence, URL liveness, and content relevance checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "rapidfuzz>=3",
    "bibtexparser>=1.4",
    "rispy>=0.9",
    "pdfminer.six>=20221105",
    "mcp[cli]>=1.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
pdf = ["refextract"]
cli-llm = ["openai>=1.0"]
domain = []
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
citesentry = "citesentry.cli:app"
citesentry-mcp = "citesentry.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
